name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build Python backend with PyInstaller — one job per OS
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13        # Intel runner — can still cross-compile arm64
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: desktop/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build backend with PyInstaller
        working-directory: desktop/backend
        run: pyinstaller db-chat-backend.spec --clean --noconfirm

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: desktop/backend/dist/db-chat-backend*
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Bundle Electron app and publish to GitHub Releases
  # ──────────────────────────────────────────────────────────────────────────
  build-electron:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            platform: mac
            electron_args: --mac
          - os: windows-latest
            platform: win
            electron_args: --win
          - os: ubuntu-22.04
            platform: linux
            electron_args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: desktop/frontend/resources/

      - name: Make backend executable (macOS / Linux)
        if: matrix.platform != 'win'
        run: chmod +x desktop/frontend/resources/db-chat-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build & publish Electron app
        working-directory: desktop/frontend
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build && npx electron-builder ${{ matrix.electron_args }} --publish always
